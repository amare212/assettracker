
services:
  postgres:
    image: postgres:17
    container_name: assettracker-postgres
    environment:
      POSTGRES_DB: assettracker_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5433:5432"
    volumes:
      - assettracker_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  assettracker_postgres_data:
